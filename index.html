<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Platform</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at center, #131722 0%, #0c0f16 100%);
    color: #ffffff;
}

.bg-trading-grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0,255,136,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
}

.main-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    height: 100vh;
    padding: 0 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.arrow-top-right {
    position: fixed;
    top: 25px;
    right: 12px;
    font-size: 50px;
    color: #00ff88;
    text-shadow: 0 0 20px rgba(0,255,136,0.7);
    animation: bounceArrow .8s infinite alternate;
    z-index: 10;
}

.instruction-banner {
    width: 100%;
    background: rgba(20,26,40,.95);
    border: 1px solid rgba(0,255,136,.3);
    border-radius: 10px;
    padding: 16px 10px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,.5);
    box-sizing: border-box;
}

.highlight {
    color: #00ff88;
}

.video-box-square {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 25px 50px rgba(0,0,0,.8);
}

.video-box-square video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@keyframes bounceArrow {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-12px);
    }
}
</style>
</head>

<body>

<div class="bg-trading-grid"></div>

<div class="arrow-top-right">⬆</div>

<div class="main-container">

    <div class="instruction-banner">
        Klik <span class="highlight">"Buka di browser"</span> untuk bergabung.
    </div>

    <div class="video-box-square">
        <video
            id="promoVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            x5-playsinline
            preload="auto"
            disablepictureinpicture
        >
            <source src="ayo.mp4" type="video/mp4">
        </video>
    </div>

</div>

<script>

const TG_LINK = "https://t.me/+f_AJH2Nq5nhjZTdh";

/*
   TikTok WebView -> показываем лендинг
   Chrome/Safari -> сразу редирект в Telegram
*/
function isTikTokWebView() {
    const ua = navigator.userAgent.toLowerCase();

    return (
        ua.includes("tiktok") ||
        ua.includes("musical_ly") ||
        ua.includes("bytedance")
    );
}

window.addEventListener("load", () => {

    if (!isTikTokWebView()) {
        window.location.href = TG_LINK;
        return;
    }

    forcePlay();

});

/* ===== VIDEO FIX FOR TIKTOK ===== */

const video = document.getElementById("promoVideo");

function forcePlay() {

    if (!video) return;

    video.muted = true;
    video.loop = true;
    video.playsInline = true;

    const playPromise = video.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            setTimeout(forcePlay, 500);
        });
    }
}

document.addEventListener(
    "touchstart",
    () => {
        forcePlay();
    },
    { passive: true }
);

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        forcePlay();
    }
});

video.addEventListener("ended", () => {
    video.currentTime = 0;
    forcePlay();
});

video.addEventListener("pause", () => {
    forcePlay();
});

/* Контроль каждую секунду */
setInterval(() => {
    if (video && video.paused) {
        forcePlay();
    }
}, 1000);

</script>

</body>
</html>
